<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon_io/favicon.ico" />
    <link
      rel="apple-touch-icon"
      href="%PUBLIC_URL%/favicon_io/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%PUBLIC_URL%/favicon_io/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="%PUBLIC_URL%/favicon_io/favicon-16x16.png"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <!--
      Page metadata defaults for the homepage. Values come from
      src/hooks/pageMetadata.json: scripts/generate-static-pages.js rewrites
      these tags for every route at build time (for crawlers and link
      previews), and src/hooks/useDocumentMetadata.js updates them in the
      browser. Keep the one-line attribute order (name/property, then content)
      so the build script can find each tag.
    -->
    <title>Halee McCray | Copywriter &amp; Content Strategist</title>
    <meta name="description" content="Halee McCray is a copywriter and content strategist writing emails, SMS, blog articles, and e-commerce copy that is clear, on-brand, and gives readers a reason to take the next step." />
    <link rel="canonical" href="https://haleemccray.com/" />
    <meta property="og:site_name" content="Halee McCray" />
    <meta property="og:title" content="Halee McCray | Copywriter &amp; Content Strategist" />
    <meta property="og:description" content="Halee McCray is a copywriter and content strategist writing emails, SMS, blog articles, and e-commerce copy that is clear, on-brand, and gives readers a reason to take the next step." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://haleemccray.com/" />
    <meta property="og:image" content="https://haleemccray.com/headshot-og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Halee McCray, copywriter and content strategist" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Halee McCray | Copywriter &amp; Content Strategist" />
    <meta name="twitter:description" content="Halee McCray is a copywriter and content strategist writing emails, SMS, blog articles, and e-commerce copy that is clear, on-brand, and gives readers a reason to take the next step." />
    <meta name="twitter:image" content="https://haleemccray.com/headshot-og.png" />
    <meta name="twitter:image:alt" content="Halee McCray, copywriter and content strategist" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- Netlify Identity Widget for CMS authentication -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!-- EmailJS is bundled via the @emailjs/browser package (see src/components/Contact). -->
    <!-- Netlify Identity configuration and redirect handler -->
    <script>
      // Wait for the widget to be ready before configuring
      window.addEventListener('DOMContentLoaded', function () {
        if (window.netlifyIdentity) {
          // Configure to use the correct Netlify site
          window.netlifyIdentity.init({
            APIUrl: 'https://haleemccray.netlify.app/.netlify/identity',
          })

          // Redirect to admin after login
          window.netlifyIdentity.on('init', (user) => {
            if (!user) {
              window.netlifyIdentity.on('login', () => {
                document.location.href = '/admin/'
              })
            }
          })
        }
      })
    </script>
  </body>
</html>
