name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Matches deploy.yml. @playwright/test is pinned to ~1.61 because
      # later releases require Node 20+.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # No lockfile is committed (package-lock.json is gitignored), so
      # `npm ci` is not available; install the same way deploy.yml does.
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run unit tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Build the project
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end smoke tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
