[build]
  command = "npm run build"
  publish = "build"

# Serve the app for client-side routes that have no generated page.
# Real files (e.g. /admin/, generated route pages) take precedence.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production.environment]
  NPM_FLAGS = "--legacy-peer-deps"
